<div class="input-wrapper" [class.primary]="primary">

    <div class="input-content">
        <input 
            [type]="type" 
            [placeholder]="placeholder"
            [value]="value"
        />
        <div class="icon">
            <ng-content/>
        </div>
    </div>
</div>
